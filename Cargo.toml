[package]
name = "activity-monitor"
version = "1.2.2"
description = "Tiny Task Manager-style CPU, memory, disk, network and GPU meters that live in the Windows taskbar"
license = "MIT"
edition = "2021"

[[bin]]
name = "ActivityMonitor"
path = "src/main.rs"

[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Registry",
  "Win32_System_Performance",
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
